<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAR Inspector — HAR to JSON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style/style.css">
</head>
<body>
<script>
(function(){
  var t = 'paper';
  try { t = localStorage.getItem('harTheme') || 'paper'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var lang = 'ar';
  try { lang = localStorage.getItem('harLang') || 'ar'; } catch(e) {}
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
})();
</script>

<header>
  <div class="brand">
    <svg width="26" height="18" viewBox="0 0 26 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 14L7 8L11 12L17 4L25 10" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="25" cy="10" r="2" fill="var(--accent)"/>
    </svg>
    <div class="brand-text">
      <h1>HAR Inspector</h1>
      <span class="sep">·</span>
      <span class="tag">HAR → JSON</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats" style="display:none;">
    <span><span id="statLabel">الطلبات</span> <b id="statTotal">0</b></span>
    <div class="strip" id="statStrip"></div>
  </div>
  <div class="theme-switch" id="themeSwitch">
    <button class="theme-swatch" data-theme="night" title="Night" style="background:conic-gradient(from 180deg, #5B7FFF 0deg 180deg, #0C0F14 180deg 360deg);"></button>
    <button class="theme-swatch active" data-theme="paper" title="Paper" style="background:conic-gradient(from 180deg, #3652E0 0deg 180deg, #F7F8FA 180deg 360deg);"></button>
    <button class="theme-swatch" data-theme="phosphor" title="Phosphor" style="background:conic-gradient(from 180deg, #39C97A 0deg 180deg, #040A05 180deg 360deg);"></button>
    <button class="theme-swatch" data-theme="amber" title="Amber" style="background:conic-gradient(from 180deg, #E8930A 0deg 180deg, #140D03 180deg 360deg);"></button>
  </div>
  <button class="btn lang-toggle" id="langBtn" title="Switch language">EN</button>
  <input type="file" id="fileInput" accept=".har,application/json">
  <button class="btn" id="loadBtn" data-i18n="loadBtn">فتح ملف HAR</button>
  <button class="btn" id="shareBtn" data-i18n="shareBtn">مشاركة مباشرة</button>
  <button class="btn primary" id="downloadBtn" disabled data-i18n="downloadBtn">تنزيل JSON</button>
  <a class="btn" id="howLink" href="./workflow.html" style="text-decoration:none;" data-i18n-title="howTitle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 11v5.5M12 7.2v.3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span data-i18n="howBtn">كيف تعمل؟</span>
  </a>
</header>

<main id="main">
  <div class="dropzone" id="dropzone">
    <svg class="mark" width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 data-i18n="dropTitle">حوّل ملف HAR إلى JSON مبسّط</h2>
    <p data-i18n="dropDesc">ارفع ملف HAR وهيتم استخراج الأساسيات بس لكل طلب: الرابط، status code، بيانات الـ request (params/body)، وبيانات الـ response — من غير أي تفاصيل زيادة.</p>
    <div class="zone" id="zone">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <b data-i18n="dropZoneLabel">اسحب ملف HAR هنا</b>
      <span class="sub" data-i18n="dropZoneSub">أو اضغط للاختيار من جهازك — .har</span>
    </div>
  </div>
</main>



</body>
<script src="./src/js/p2p-share.js"></script>
<script src="./src/js/p2p-share-ui.js"></script>
<script src="./src/js/main.js"></script>

</html>
